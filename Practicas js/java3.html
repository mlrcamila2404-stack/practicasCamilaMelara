<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let nombre, n1, n2;

        nombre = prompt("Ingresa tu nombre:")
        n1 = prompt("Ingresa tu primer numero:")
        n2 = prompt("Ingresa tu segundo numero:")

        document.write("Hola " + nombre + "<br>");

        suma = Number(n1) + Number (n2);
        document.write("El resultado de tu suma es:" + suma + "<br>");

        resta = Number(n1) - Number(n2)
        document.write("El resultado de tu resta es:" + resta + "<br>");

        multiplicación = Number(n1) * Number(n2)
        document.write("El resultado de tu multiplicación es:" + multiplicación + "<br>");

        división = Number(n1) / Number(n2)
        document.write("El resultado de tu división es:" + división + "<br>");

        residuo = Number(n1) % Number(n2)
        document.write("El resultado de tu residuo es:" + residuo + "<br>");
    </script>
</body>
</html>
